name: Test, Build, and Distribute App (android for now)

on:
  push:
    branches:
      - dev
      - staging
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev

jobs:
  test-and-build:
    if: github.ref_name == 'dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Info
        if: github.event_name == 'push'
        id: pr_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --state merged --search "SHA:${{ github.sha }}" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY=$(gh pr view $PR_NUMBER --json body --jq '.body')
            echo "body=$PR_BODY" >> $GITHUB_OUTPUT
          else
            echo "body=" >> $GITHUB_OUTPUT
          fi

      - name: Set Manual Dispatch Description
        if: github.event_name == 'workflow_dispatch'
        id: manual_description
        run: |
          echo "body=Manual dev distribution triggered by ${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: './composeApp'

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > composeApp/google-services.json

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            ./gradlew testProdDebugUnitTest
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            ./gradlew testStagingDebugUnitTest
          else
            ./gradlew testDevDebugUnitTest
          fi

      - name: Build Dev APK
        run: ./gradlew assembleDevDebug

  test-build-and-distribute:
    if: (github.ref_name == 'staging' || github.ref_name == 'main' || github.ref_name == 'master') && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event_name == 'workflow_dispatch' && 'dev' || ((github.ref_name == 'main' || github.ref_name == 'master') && 'prod' || 'staging') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Info
        if: github.event_name == 'push'
        id: pr_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --state merged --search "SHA:${{ github.sha }}" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY=$(gh pr view $PR_NUMBER --json body --jq '.body')
            echo "body=$PR_BODY" >> $GITHUB_OUTPUT
          else
            echo "body=" >> $GITHUB_OUTPUT
          fi

      - name: Set Manual Dispatch Description
        if: github.event_name == 'workflow_dispatch'
        id: manual_description
        run: |
          echo "body=Manual dev distribution triggered by ${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: './composeApp'

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > composeApp/google-services.json

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            ./gradlew testProdDebugUnitTest
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            ./gradlew testStagingDebugUnitTest
          else
            ./gradlew testDevDebugUnitTest
          fi

      - name: Create Keystore Properties for Gradle
        run: |
          mkdir -p composeApp/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > composeApp/keystore/weatherio-release-key.jks

          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=./keystore/weatherio-release-key.jks" >> keystore.properties

      - name: Run Fastlane Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          PR_DESCRIPTION: ${{ github.event_name == 'push' && steps.pr_info.outputs.body || steps.manual_description.outputs.body }}
        run: |
          cd ./composeApp
          bundle exec fastlane distribute